name: 캠핑장 토요일 빈자리 알리미

on:
  # GitHub는 예약 실행을 '되도록' 해줄 뿐이라, 15분마다 걸어도 실제로는
  # 2~5시간에 한 번만 켜진다. 그래서 '자주 켜기' 대신 '한 번 켜지면 오래 돌기'로 간다.
  # 켜진 실행 하나가 5시간 30분 동안 쉬지 않고 확인하므로, 다음 실행이 늦게 켜져도
  # 그 사이가 비지 않는다. (공개 저장소는 실행 시간이 무제한 무료)
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 모드 (지금 달력 상태를 한 번만 텔레그램으로 보내기)"
        type: boolean
        default: false

permissions:
  contents: write              # state.json(기억 파일) 저장용
  actions: write               # 차단되면 자동 실행을 스스로 끄기용

concurrency:
  group: camping-monitor       # 같은 시간에 두 개가 겹쳐 돌지 않게
  cancel-in-progress: false    # 돌고 있는 것을 끊지 않고, 끝나면 다음 것이 이어받게

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # GitHub 한도는 360분
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: 빈자리 확인 (5시간 30분 동안 2분마다)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: ${{ inputs.test }}
          TARGET_DATES: ${{ vars.TARGET_DATES }}
          # 아래 두 개는 Settings > Secrets and variables > Actions > Variables 에서
          # INTERVAL_SECONDS / LOOP_MINUTES 를 만들면 그 값으로 바뀐다.
          INTERVAL_SECONDS: ${{ vars.INTERVAL_SECONDS || '120' }}
          LOOP_MINUTES: ${{ vars.LOOP_MINUTES || '330' }}
          WORKFLOW_FILE: monitor.yml
        run: python monitor.py

      - name: 기억 파일 저장
        if: always()
        continue-on-error: true      # 저장 실패해도 알림 기능은 계속
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "상태 업데이트"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "밀어넣기 재시도 $i"
              sleep 5
            done
            echo "state.json 저장 실패(무시하고 계속)"
          fi

      - name: 문제 확인용 화면 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # 위 단계 중 하나라도 터지면(설치 실패 등) 조용히 죽지 않도록 알림
      - name: 실패 알림
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="⚠️ 캠핑장 알리미 실행이 실패했어요.
          빈자리 확인을 못 했어요. 아래 주소에서 빨간 글씨를 확인해 주세요.
          $RUN_URL"
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null || true
