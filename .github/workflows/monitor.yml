name: 캠핑장 토요일 빈자리 알리미

on:
  schedule:
    - cron: "*/5 * * * *"      # 5분마다 (GitHub 사정에 따라 조금 늦어질 수 있음)
  workflow_dispatch:           # 내가 직접 버튼 눌러 실행하기
    inputs:
      test:
        description: "테스트 모드 (지금 토요일 칸 상태를 텔레그램으로 보내기)"
        type: boolean
        default: false

permissions:
  contents: write              # state.json(기억 파일) 저장용
  actions: write               # 차단되면 자동 실행을 스스로 끄기용

concurrency:
  group: camping-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: 토요일 빈자리 확인
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MODE: ${{ inputs.test }}
          WORKFLOW_FILE: monitor.yml
        run: python monitor.py

      - name: 기억 파일 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "상태 업데이트"
            git push
          fi

      - name: 문제 확인용 화면 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
